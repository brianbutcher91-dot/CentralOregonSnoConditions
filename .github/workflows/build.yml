name: Build conditions data

on:
  # GitHub's own `schedule` trigger is best-effort and gets significantly
  # deprioritized for tight intervals like every 15 minutes - measured runs
  # landing every 2-6 hours instead in practice, not a config problem.
  # repository_dispatch (fired by an external cron service hitting GitHub's
  # REST API, see cron-job.org setup) is the real 15-minute trigger; this
  # schedule is kept only as a much-lower-frequency fallback in case that
  # external service has its own downtime.
  schedule:
    - cron: "0 */2 * * *"
  repository_dispatch:
    types: [build-conditions]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python build_conditions.py
        env:
          ODOT_API_KEY: ${{ secrets.ODOT_API_KEY }}

      - name: Commit and push if the data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add conditions.json gfs_snowfall_pnw.gif gfs_snowfall_legend.png bachelor_snow_history.json
          git diff --staged --quiet || git commit -m "Update conditions data"
          git push
